name: ${COMPOSE_PROJECT_NAME:-srm-stage0}

services:
  mysql:
    image: mysql:8.4
    entrypoint: ["/bin/sh", "/usr/local/bin/srm-mysql-secure-entrypoint.sh"]
    environment:
      MYSQL_DATABASE: ${SRM_DB_NAME:-srm}
      MYSQL_USER: ${SRM_DB_USERNAME:-srm_app}
      MYSQL_PASSWORD: ${SRM_DB_PASSWORD:?SRM_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${SRM_DB_ROOT_PASSWORD:?SRM_DB_ROOT_PASSWORD is required}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/docker/mysql-secure-entrypoint.sh:/usr/local/bin/srm-mysql-secure-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [srm-network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SRM_DB_URL: jdbc:mysql://mysql:3306/${SRM_DB_NAME:-srm}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SRM_DB_USERNAME: ${SRM_DB_USERNAME:-srm_app}
      SRM_DB_PASSWORD: ${SRM_DB_PASSWORD:?SRM_DB_PASSWORD is required}
      SRM_JWT_SECRET: ${SRM_JWT_SECRET:?SRM_JWT_SECRET is required}
      SRM_BOOTSTRAP_ADMIN_USERNAME: ${SRM_BOOTSTRAP_ADMIN_USERNAME:-admin}
      SRM_BOOTSTRAP_ADMIN_PASSWORD: ${SRM_BOOTSTRAP_ADMIN_PASSWORD:?SRM_BOOTSTRAP_ADMIN_PASSWORD is required}
      SRM_BOOTSTRAP_VIEWER_USERNAME: ${SRM_BOOTSTRAP_VIEWER_USERNAME:-skeleton_viewer}
      SRM_BOOTSTRAP_VIEWER_PASSWORD: ${SRM_BOOTSTRAP_VIEWER_PASSWORD:?SRM_BOOTSTRAP_VIEWER_PASSWORD is required}
      SRM_CORS_ALLOWED_ORIGINS: ${SRM_CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      SRM_LOG_LEVEL: ${SRM_LOG_LEVEL:-INFO}
      SRM_OPENAPI_ENABLED: ${SRM_OPENAPI_ENABLED:-true}
      SRM_SECURE_COOKIES: "false"
      SRM_ATTACHMENT_ROOT: /var/lib/srm/attachments
      TZ: UTC
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - attachments-data:/var/lib/srm/attachments
    ports:
      - "127.0.0.1:${SRM_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [srm-network]

  internal-web:
    build:
      context: .
      dockerfile: deploy/docker/internal-web.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [srm-network]

  supplier-web:
    build:
      context: .
      dockerfile: deploy/docker/supplier-web.Dockerfile
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [srm-network]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      internal-web:
        condition: service_healthy
      supplier-web:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${SRM_GATEWAY_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [srm-network]

volumes:
  mysql-data:
  attachments-data:

networks:
  srm-network:
    driver: bridge
