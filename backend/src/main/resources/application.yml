spring:
  application:
    name: srm-backend
  profiles:
    default: dev
  datasource:
    url: ${SRM_DB_URL}
    username: ${SRM_DB_USERNAME}
    password: ${SRM_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${SRM_DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    cache-names:
      - navigation-menus
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  packages-to-scan: com.srm

mybatis-plus:
  mapper-locations: classpath*:/mybatis/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    local-cache-scope: statement
  global-config:
    banner: false
    db-config:
      id-type: auto

server:
  port: ${SRM_SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

srm:
  environment: development
  security:
    jwt-secret: ${SRM_JWT_SECRET}
    access-token-ttl: ${SRM_ACCESS_TOKEN_TTL:PT10M}
    refresh-token-ttl: ${SRM_REFRESH_TOKEN_TTL:P7D}
    allowed-origins: ${SRM_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    bootstrap-admin-username: ${SRM_BOOTSTRAP_ADMIN_USERNAME:admin}
    bootstrap-admin-password: ${SRM_BOOTSTRAP_ADMIN_PASSWORD}
    bootstrap-viewer-username: ${SRM_BOOTSTRAP_VIEWER_USERNAME:skeleton_viewer}
    bootstrap-viewer-password: ${SRM_BOOTSTRAP_VIEWER_PASSWORD}
    secure-cookies: ${SRM_SECURE_COOKIES:false}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-none}]"
  level:
    root: ${SRM_LOG_LEVEL:INFO}
    org.springframework.security: WARN
