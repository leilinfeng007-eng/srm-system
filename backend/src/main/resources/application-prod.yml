spring:
  config:
    activate:
      on-profile: prod

srm:
  environment: production
  attachment:
    root: ${SRM_ATTACHMENT_ROOT:/var/lib/srm/attachments}
    max-file-size: 20MB
  security:
    secure-cookies: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  shutdown: graceful
