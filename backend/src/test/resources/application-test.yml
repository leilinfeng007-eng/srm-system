spring:
  datasource:
    url: jdbc:h2:mem:srm_stage0;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

srm:
  environment: test
  security:
    jwt-secret: stage0-test-only-jwt-secret-with-more-than-32-bytes
    access-token-ttl: PT10M
    refresh-token-ttl: P7D
    allowed-origins:
      - http://localhost:5173
    bootstrap-admin-username: stage0_admin
    bootstrap-admin-password: Stage0AdminTestOnly!2026
    bootstrap-viewer-username: stage0_viewer
    bootstrap-viewer-password: Stage0ViewerTestOnly!2026
    secure-cookies: false

logging:
  level:
    root: WARN
